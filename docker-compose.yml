version: "3.9"

services:
  # ============================================
  # PostgreSQL — Primary data store
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: trialguard-postgres
    environment:
      POSTGRES_USER: trialguard
      POSTGRES_PASSWORD: trialguard_secret_2026
      POSTGRES_DB: trialguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trialguard -d trialguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trialguard-net

  # ============================================
  # Redis — Cache, Celery broker, WebSocket pub/sub
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: trialguard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trialguard-net

  # ============================================
  # FastAPI Backend
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trialguard-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://trialguard:trialguard_secret_2026@postgres:5432/trialguard_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=trialguard-jwt-secret-change-in-production-2026
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=60
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - S3_BUCKET_NAME=trialguard-documents
      - S3_REGION=us-east-1
      - FAISS_INDEX_PATH=/app/data/faiss_indexes
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - faiss_data:/app/data/faiss_indexes
      - document_storage:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/admin/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - trialguard-net

  # ============================================
  # Celery Worker — Async agent task execution
  # ============================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trialguard-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q default,validation,ingestion,agents
    environment:
      - DATABASE_URL=postgresql+asyncpg://trialguard:trialguard_secret_2026@postgres:5432/trialguard_db
      - REDIS_URL=redis://redis:6379/0
      - FAISS_INDEX_PATH=/app/data/faiss_indexes
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/app:/app/app
      - faiss_data:/app/data/faiss_indexes
      - document_storage:/app/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trialguard-net

  # ============================================
  # Celery Beat — Scheduled tasks
  # ============================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trialguard-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://trialguard:trialguard_secret_2026@postgres:5432/trialguard_db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trialguard-net

  # ============================================
  # Next.js Frontend
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trialguard-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - trialguard-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  faiss_data:
    driver: local
  document_storage:
    driver: local

networks:
  trialguard-net:
    driver: bridge
